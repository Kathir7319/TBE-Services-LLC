<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="50%" stop-color="#059669" />
      <stop offset="100%" stop-color="#064e3b" />
    </linearGradient>
    <linearGradient id="leafLight" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#a7f3d0" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#fbbf24" />
    </linearGradient>
  </defs>

  <!-- Outer Shield Crest -->
  <rect x="2" y="2" width="96" height="96" rx="24" fill="url(#shieldGrad)" stroke="#6ee7b7" stroke-width="2" stroke-opacity="0.5" />

  <!-- Stylized Lawn Blade 1 (Left) -->
  <path d="M 32 75 C 30 52, 38 40, 48 30 C 44 45, 42 62, 38 75 Z" fill="url(#leafLight)" opacity="0.9" />

  <!-- Stylized Center Blade (Tall Main Blade) -->
  <path d="M 48 76 C 45 46, 52 24, 66 18 C 60 38, 58 58, 52 76 Z" fill="#ffffff" />

  <!-- Stylized Lawn Blade 3 (Right) -->
  <path d="M 54 75 C 57 56, 68 45, 78 38 C 70 52, 64 65, 58 75 Z" fill="url(#leafLight)" opacity="0.85" />

  <!-- Precision Laser Cut Horizon Line -->
  <path d="M 22 76 L 78 76" stroke="url(#goldGrad)" stroke-width="4" stroke-linecap="round" />

  <!-- Sparkle of Pristine Quality -->
  <path d="M 72 24 Q 72 29 77 29 Q 72 29 72 34 Q 72 29 67 29 Q 72 29 72 24 Z" fill="url(#goldGrad)" />
</svg>
