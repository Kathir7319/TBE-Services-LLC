<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 120" width="100%" height="100%">
  <defs>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="50%" stop-color="#059669" />
      <stop offset="100%" stop-color="#064e3b" />
    </linearGradient>
    <linearGradient id="leafLight" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#a7f3d0" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#fbbf24" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#047857" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- LOGO EMBLEM / ICON -->
  <g transform="translate(10, 10)" filter="url(#shadow)">
    <!-- Outer Shield Crest -->
    <rect x="0" y="0" width="100" height="100" rx="24" fill="url(#shieldGrad)" />
    
    <!-- Outer Border Glow -->
    <rect x="2" y="2" width="96" height="96" rx="22" fill="none" stroke="#6ee7b7" stroke-width="1.5" stroke-opacity="0.4" />

    <!-- Stylized Lawn Blade 1 (Left) -->
    <path d="M 32 75 C 30 52, 38 40, 48 30 C 44 45, 42 62, 38 75 Z" fill="url(#leafLight)" opacity="0.9" />

    <!-- Stylized Center Blade (Tall Main Blade) -->
    <path d="M 48 76 C 45 46, 52 24, 66 18 C 60 38, 58 58, 52 76 Z" fill="#ffffff" />

    <!-- Stylized Lawn Blade 3 (Right) -->
    <path d="M 54 75 C 57 56, 68 45, 78 38 C 70 52, 64 65, 58 75 Z" fill="url(#leafLight)" opacity="0.85" />

    <!-- Precision Laser Cut Horizon Line (Represents Crisp Edging) -->
    <path d="M 22 76 L 78 76" stroke="url(#goldGrad)" stroke-width="3" stroke-linecap="round" />

    <!-- Star / Sparkle of Pristine Care -->
    <path d="M 72 24 Q 72 29 77 29 Q 72 29 72 34 Q 72 29 67 29 Q 72 29 72 24 Z" fill="url(#goldGrad)" />
  </g>

  <!-- TYPOGRAPHY: TBE SERVICES LLC -->
  <g transform="translate(126, 0)">
    <!-- TBE Main Acronym -->
    <text x="0" y="62" font-family="'Plus Jakarta Sans', 'Inter', -apple-system, sans-serif" font-size="52" font-weight="900" fill="#0f172a" letter-spacing="-0.5">
      TBE
    </text>

    <!-- SERVICES with Emerald Glow -->
    <text x="110" y="62" font-family="'Plus Jakarta Sans', 'Inter', -apple-system, sans-serif" font-size="52" font-weight="800" fill="#059669" letter-spacing="-0.5">
      SERVICES
    </text>

    <!-- LLC Badge -->
    <rect x="368" y="26" width="46" height="24" rx="6" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.2" />
    <text x="375" y="42" font-family="'Inter', sans-serif" font-size="12" font-weight="800" fill="#475569" letter-spacing="0.5">
      LLC
    </text>

    <!-- Sub-text / Tagline -->
    <text x="2" y="86" font-family="'Plus Jakarta Sans', 'Inter', -apple-system, sans-serif" font-size="13.5" font-weight="700" fill="#64748b" letter-spacing="3.2">
      PROPERTY MAINTENANCE • LAWN CARE
    </text>

    <!-- Location Pill -->
    <g transform="translate(2, 94)">
      <circle cx="4" cy="4" r="3" fill="#10b981" />
      <text x="12" y="7.5" font-family="'Inter', sans-serif" font-size="10.5" font-weight="600" fill="#047857" letter-spacing="1">
        MORRISVILLE, NC
      </text>
    </g>
  </g>
</svg>
